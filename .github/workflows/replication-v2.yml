name: Replication v2 and deployment filesystems

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      diagnose_rewrite_wait:
        description: Optional exact control SHA for matched Intel rewrite waits
        type: string
        default: ''
      diagnose_arm:
        description: Repeat the ARM64 concurrent recovery soak with failure stacks
        type: boolean
        default: false
      diagnose_slow_reader:
        description: Repeat the existing slow-reader assertion with failure stack capture
        type: boolean
        default: false
      diagnose_contention:
        description: Compare full test runs at matched baseline/candidate with package concurrency controlled
        type: boolean
        default: false
      diagnose_fairness:
        description: Compare pending-command fairness on an Apple Silicon Go 1.26 runner
        type: boolean
        default: false
      diagnose_large_replay:
        description: Measure large collection replay on matched Intel runtimes
        type: boolean
        default: false
      diagnose_pending_replies:
        description: Compare the pending-reply regression and full suites on one Intel runner
        type: boolean
        default: false
  workflow_call:
    inputs:
      long_filesystem_soak:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rewrite_wait_diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_rewrite_wait != ''
    uses: ./.github/workflows/rewrite-stall-diagnostic.yml
    with:
      baseline: ${{ inputs.diagnose_rewrite_wait }}

  fairness_diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_fairness
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: '1.26.7' }
      - name: Build exact runtimes with identical diagnostic assertions
        run: |
          git worktree add --detach "$RUNNER_TEMP/baseline" 3f16dfaaaf3b12bd79f08a31875c20e6307eaee5
          cp cmd/keel/pipeline_fairness_test.go "$RUNNER_TEMP/baseline/cmd/keel/pipeline_fairness_test.go"
          mkdir -p dist/fairness-diagnostic
          git rev-parse HEAD > dist/fairness-diagnostic/candidate-revision.log
          go version > dist/fairness-diagnostic/toolchain.log
          sysctl hw.ncpu hw.memsize > dist/fairness-diagnostic/host.log
          go test -c -o "$RUNNER_TEMP/candidate.test" ./cmd/keel
          go -C "$RUNNER_TEMP/baseline" test -c -o "$RUNNER_TEMP/baseline.test" ./cmd/keel
          go version -m "$RUNNER_TEMP/candidate.test" > dist/fairness-diagnostic/candidate-build.log
          go version -m "$RUNNER_TEMP/baseline.test" > dist/fairness-diagnostic/baseline-build.log
      - name: Preserve all focused and complete outcomes without changing deadlines
        timeout-minutes: 18
        shell: bash
        run: |
          failed=0
          for arm in baseline candidate; do
            "$RUNNER_TEMP/$arm.test" -test.run='^TestPipelineYieldsWithCommandsStillPending$' -test.count=50 -test.timeout=6m -test.v > "dist/fairness-diagnostic/$arm-focused.log" 2>&1 || failed=1
          done
          for repetition in 1 2 3; do
            if [[ "$repetition" == 2 ]]; then arms="candidate baseline"; else arms="baseline candidate"; fi
            for arm in $arms; do
              source="$GITHUB_WORKSPACE"
              if [[ "$arm" == baseline ]]; then source="$RUNNER_TEMP/baseline"; fi
              go -C "$source" test -p 4 -count=1 ./... > "dist/fairness-diagnostic/$arm-suite-$repetition.log" 2>&1 || failed=1
            done
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fairness-diagnostic
          path: dist/fairness-diagnostic
          retention-days: 30

  pending_reply_diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_pending_replies
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: '1.27.1' }
      - name: Build exact baseline and candidate process tests
        run: |
          git worktree add --detach "$RUNNER_TEMP/baseline" 54ed959881ffbe9a1bbe4b90a32d2b9df750f487
          cp cmd/keel/integration_test.go "$RUNNER_TEMP/baseline/cmd/keel/integration_test.go"
          mkdir -p dist/pending-reply-diagnostic
          shasum -a 256 cmd/keel/integration_test.go > dist/pending-reply-diagnostic/harness.log
          go test -c -o "$RUNNER_TEMP/candidate.test" ./cmd/keel
          go -C "$RUNNER_TEMP/baseline" test -c -o "$RUNNER_TEMP/baseline.test" ./cmd/keel
          git rev-parse HEAD > dist/pending-reply-diagnostic/candidate-revision.log
          go version -m "$RUNNER_TEMP/baseline.test" > dist/pending-reply-diagnostic/baseline-build.log
          go version -m "$RUNNER_TEMP/candidate.test" > dist/pending-reply-diagnostic/candidate-build.log
          sysctl hw.ncpu hw.memsize > dist/pending-reply-diagnostic/host.log
      - name: Preserve all repeated regression and full-suite outcomes
        timeout-minutes: 18
        shell: bash
        run: |
          failed=0
          for arm in baseline candidate; do
            "$RUNNER_TEMP/$arm.test" -test.run='^TestPendingRepliesSurviveOtherTraffic$' -test.count=100 -test.v > "dist/pending-reply-diagnostic/$arm-focused.log" 2>&1 || failed=1
          done
          for repetition in 1 2 3; do
            if [[ "$repetition" == 2 ]]; then arms="candidate baseline"; else arms="baseline candidate"; fi
            for arm in $arms; do
              source="$GITHUB_WORKSPACE"
              if [[ "$arm" == baseline ]]; then source="$RUNNER_TEMP/baseline"; fi
              go -C "$source" test -p 4 -count=1 ./... > "dist/pending-reply-diagnostic/$arm-suite-$repetition.log" 2>&1 || failed=1
            done
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pending-reply-diagnostic
          path: dist/pending-reply-diagnostic
          retention-days: 30

  large_replay_diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_large_replay
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: '1.27.1' }
      - name: Build exact runtimes with identical replay assertions
        run: |
          git worktree add --detach "$RUNNER_TEMP/baseline" 9aa66d16c644a174b3ce2d229a32466fd6c0df6b
          cp cmd/keel/integration_test.go cmd/keel/collection_reply_test.go "$RUNNER_TEMP/baseline/cmd/keel/"
          mkdir -p dist/large-replay-diagnostic
          shasum -a 256 cmd/keel/integration_test.go cmd/keel/collection_reply_test.go > dist/large-replay-diagnostic/harness.log
          go test -c -o "$RUNNER_TEMP/candidate.test" ./cmd/keel
          go -C "$RUNNER_TEMP/baseline" test -c -o "$RUNNER_TEMP/baseline.test" ./cmd/keel
          git rev-parse HEAD > dist/large-replay-diagnostic/candidate-revision.log
          go version -m "$RUNNER_TEMP/baseline.test" > dist/large-replay-diagnostic/baseline-build.log
          go version -m "$RUNNER_TEMP/candidate.test" > dist/large-replay-diagnostic/candidate-build.log
          sysctl hw.ncpu hw.memsize > dist/large-replay-diagnostic/host.log
      - name: Preserve all repeated replay outcomes and readiness times
        timeout-minutes: 18
        shell: bash
        run: |
          failed=0
          for repetition in 1 2 3; do
            if [[ "$repetition" == 2 ]]; then arms="candidate baseline"; else arms="baseline candidate"; fi
            for arm in $arms; do
              "$RUNNER_TEMP/$arm.test" -test.run='^TestRejectedCollectionPopsPreservePipelineAndRestart$' -test.count=1 -test.timeout=3m -test.v > "dist/large-replay-diagnostic/$arm-$repetition.log" 2>&1 || failed=1
            done
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: large-replay-diagnostic
          path: dist/large-replay-diagnostic
          retention-days: 30

  arm_diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_arm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { persist-credentials: false }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: stable }
      - name: Build and record exact diagnostic runtime
        run: |
          go build -trimpath -o /tmp/keel-arm-diagnostic ./cmd/keel
          mkdir -p dist/arm-diagnostic
          go version -m /tmp/keel-arm-diagnostic > dist/arm-diagnostic/build.log
          git rev-parse HEAD >> dist/arm-diagnostic/build.log
      - name: Three fresh five-minute runs with unchanged deadlines
        run: |
          failed=0
          for repetition in 1 2 3; do
            python3 scripts/soak.py --bin /tmp/keel-arm-diagnostic --out "dist/arm-diagnostic/run-$repetition" --seconds 300 --cycle-seconds 15 --concurrent --replication-protocol 2 || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm-diagnostic
          path: |
            dist/arm-diagnostic/**/*.json
            dist/arm-diagnostic/**/*.jsonl
            dist/arm-diagnostic/**/*.log
          retention-days: 14

  contention_diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_contention }}
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, candidate]
        parallelism: [1, 4]
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: '1.27.1' }
      - name: Preserve matched diagnostic tests and choose runtime
        env:
          ARM: ${{ matrix.arm }}
        run: |
          cp cmd/keel/integration_test.go /tmp/integration_test.go
          cp internal/core/expire_test.go /tmp/expire_test.go
          mkdir -p dist/contention
          git rev-parse HEAD > dist/contention/harness-revision.log
          if [[ "$ARM" == baseline ]]; then
            git checkout --detach ce911d31cae937032af80785e531d17739edc932
          fi
          git rev-parse HEAD > dist/contention/runtime-revision.log
          cp /tmp/integration_test.go cmd/keel/integration_test.go
          cp /tmp/expire_test.go internal/core/expire_test.go
          sysctl hw.ncpu hw.memsize > dist/contention/host.log
      - name: Repeat complete tests under recorded package concurrency
        env:
          TEST_PARALLELISM: ${{ matrix.parallelism }}
        shell: bash
        run: |
          set -o pipefail
          go test -p "$TEST_PARALLELISM" -count=3 ./... 2>&1 | tee dist/contention/test.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: contention-${{ matrix.arm }}-p${{ matrix.parallelism }}
          path: dist/contention
          retention-days: 30

  slow_reader_diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_slow_reader }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { persist-credentials: false }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: stable }
      - name: Repeat the unchanged two-second fairness assertion
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist/slow-reader
          go test ./cmd/keel -run '^TestSlowReaderDoesNotBlockOtherClients$' -count=30 -timeout=10m -v 2>&1 | tee dist/slow-reader/test.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: slow-reader-${{ matrix.os }}
          path: dist/slow-reader
          retention-days: 30

  native:
    if: ${{ !inputs.long_filesystem_soak }}
    name: Native recovery / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15-intel]
    # Standard runners are free for this public repository. No larger runners.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: stable
      - name: Build and test natively
        run: |
          uname -a
          python3 -m unittest discover -s scripts -p 'test_check_archive.py'
          go test ./...
          go build -trimpath -o /tmp/keel-native ./cmd/keel
          mkdir -p dist/native
          go version -m /tmp/keel-native > dist/native/build.log
          git rev-parse HEAD >> dist/native/build.log
      - name: Streaming snapshots, interrupted transfers and restart checkpoints
        run: python3 scripts/check-replication-v2.py --bin /tmp/keel-native --out dist/native/replication --concurrent
      - name: Mixed-version protocol 2 and nonzero-term restart
        shell: bash
        run: |
          set -euo pipefail
          task_baseline=a7c6600cece5d21a78794e40e2f59be0e55028d4
          task_source="$RUNNER_TEMP/keel-preterm-source"
          mkdir "$task_source"
          git fetch --depth=1 origin "$task_baseline"
          git archive "$task_baseline" | tar -x -C "$task_source"
          go -C "$task_source" build -trimpath -o /tmp/keel-preterm ./cmd/keel
          printf '%s\n' "$task_baseline" > dist/native/preterm-revision.log
          go version -m /tmp/keel-preterm > dist/native/preterm-build.log
          python3 scripts/check-term-upgrade.py --baseline /tmp/keel-preterm --candidate /tmp/keel-native --out dist/native/term-upgrade
      - name: Execute alpha.3 release archive and verify upgrade with rollback
        shell: bash
        run: |
          task_platform="$(go env GOOS)_$(go env GOARCH)"
          task_archive="keel_v0.1.0-alpha.3_$task_platform.tar.gz"
          # Pinned from the reviewed native archive reports in
          # bench/results/runtime-native-filesystem-2026-09-06.json.
          # A mutable release asset/checksum pair cannot change this trust pin.
          case "$task_platform" in
            linux_arm64) task_digest=687427234be21d6e05b62ea018895bd92cd0760d02845225a033ffaa17d1cc00 ;;
            darwin_amd64) task_digest=12785d31c0a3c1b845175eef627cd1d7d9d08ffab8e17c0a8818c4d666a1f0ab ;;
            *) exit 1 ;;
          esac
          task_url="https://github.com/brandopakel/keel/releases/download/v0.1.0-alpha.3"
          mkdir -p dist/native/download
          curl -fL --retry 3 "$task_url/$task_archive" -o "dist/native/download/$task_archive"
          curl -fL --retry 3 "$task_url/$task_archive.sha256" -o "dist/native/download/$task_archive.sha256"
          python3 scripts/check-archive.py --archive "dist/native/download/$task_archive" --expected-sha256 "$task_digest" --out dist/native/alpha3
          python3 scripts/check-upgrade.py --baseline "$PWD/dist/native/alpha3/keel" --candidate /tmp/keel-native --out dist/native/upgrade
      - name: Ordered append replies and crash recovery
        run: python3 scripts/check-ordered-append.py --bin /tmp/keel-native --out dist/native/ordered --clients 16 --iterations 200
      - name: Mixed workload and storage failures
        run: python3 scripts/soak.py --bin /tmp/keel-native --out dist/native/soak --seconds 120 --cycle-seconds 15 --concurrent --replication-protocol 2
      - name: Real ENOSPC with concurrent appends on an owned bounded mount
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          task_fault_mount="$RUNNER_TEMP/keel-native-fault"
          mkdir "$task_fault_mount"
          sudo mount -t tmpfs -o size=16m,mode=0777 tmpfs "$task_fault_mount"
          trap 'sudo umount "$task_fault_mount"' EXIT
          python3 scripts/soak.py --bin /tmp/keel-native --fault-only --concurrent --disk-root "$task_fault_mount" --out dist/native/enospc
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.os }}
          path: |
            dist/native/**/*.json
            dist/native/**/*.jsonl
            dist/native/**/*.log
          retention-days: 7

  filesystems:
    name: Recovery on ${{ matrix.fs }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.long_filesystem_soak && 270 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        fs: [ext4, xfs]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: stable
      - name: Build and prepare filesystem tools
        run: |
          go build -trimpath -o /tmp/keel-filesystem ./cmd/keel
          sudo apt-get update
          sudo apt-get install -y xfsprogs
      - name: Exercise an owned temporary filesystem
        env:
          KEEL_TEST_FS: ${{ matrix.fs }}
          KEEL_SOAK_SECONDS: ${{ inputs.long_filesystem_soak && '14400' || '180' }}
          KEEL_CYCLE_SECONDS: ${{ inputs.long_filesystem_soak && '300' || '20' }}
        shell: bash
        run: |
          set -euo pipefail
          task_image="$RUNNER_TEMP/keel-validation.img"
          task_mount="$RUNNER_TEMP/keel-validation-mount"
          task_reports="$GITHUB_WORKSPACE/dist/filesystem"
          mkdir -p "$task_mount" "$task_reports"
          go version -m /tmp/keel-filesystem > "$task_reports/build.log"
          git rev-parse HEAD >> "$task_reports/build.log"
          truncate -s 512M "$task_image"
          task_loop=$(sudo losetup --find --show "$task_image")
          cleanup() {
            python3 - "$task_mount" "$task_reports" <<'PY'
          import pathlib, shutil, sys
          source, target = map(pathlib.Path, sys.argv[1:])
          for p in source.rglob('*'):
              if p.is_file() and p.suffix in ('.json', '.jsonl', '.log'):
                  out = target / p.relative_to(source)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(p, out)
          PY
            sudo umount "$task_mount" || true
            sudo losetup -d "$task_loop"
          }
          trap cleanup EXIT
          if [ "$KEEL_TEST_FS" = ext4 ]; then
            sudo mkfs.ext4 -F "$task_loop"
          else
            sudo mkfs.xfs -f "$task_loop"
          fi
          sudo mount "$task_loop" "$task_mount"
          sudo chown "$(id -u):$(id -g)" "$task_mount"
          findmnt "$task_mount" > "$task_reports/mount.log"
          python3 scripts/soak.py --bin /tmp/keel-filesystem --out "$task_mount/soak" --seconds "$KEEL_SOAK_SECONDS" --cycle-seconds "$KEEL_CYCLE_SECONDS" --concurrent --replication-protocol 2
      - name: Preserve filesystem reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: filesystem-${{ matrix.fs }}
          path: dist/filesystem
          retention-days: 7
