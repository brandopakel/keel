name: Scheduled soak

# A 48-hour run needs a machine nobody needs back. That is the one resource this
# project does not have, so the long-run gate is met a different way: repeated
# independent runs on free runners, accumulating trials rather than uptime.
#
# The two are not the same and the difference is worth stating. Independent
# starts are better at finding rare races, because each run re-rolls the timing
# that produces them. A single long run is better at finding slow growth and
# anything that depends on elapsed time. Growth is covered directly instead, by
# the bounds in soak.py, which fail on the shape of the defect rather than
# waiting for it to become a symptom.
#
# Each job stays under the six-hour runner limit with margin. The 48 hours
# themselves run as long-soak.yml, in segments, and as one uninterrupted run
# on a self-hosted runner: the `uptime` job below, dispatched with uptime=true
# onto the `runner` input, and any arm can be dispatched onto that runner the
# same way. Self-hosted jobs may run for five days. Both 48-hour forms are
# dispatched, not scheduled: the gate was met twice in September 2026, and it
# is re-run on a release candidate rather than every week. See
# docs/long-run-gate.md, and scripts/provision-soak-runner.sh for the machine.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Duration per soak, seconds
        default: '16200'
      cycle_seconds:
        description: Seconds between crash/recovery cycles
        default: '30'
      runner:
        description: Runner label; a self-hosted label for a run past six hours
        default: ubuntu-latest
      timeout_minutes:
        description: Job timeout; GitHub-hosted runners end at 360 regardless
        default: '330'
      uptime:
        description: Run only the 48-hour continuous-primary uptime job, on `runner`; ignores seconds and timeout_minutes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  soak:
    name: ${{ matrix.name }}
    if: github.event.inputs.uptime != 'true'
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes || '330') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: protocol 1, recovery
            args: --replication-protocol 1 --primary-crash-every 3
          - name: protocol 2 concurrent, recovery
            args: --replication-protocol 2 --concurrent --primary-crash-every 3
          - name: protocol 2 concurrent, continuous primary
            args: --replication-protocol 2 --concurrent --primary-crash-every 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -trimpath -o /tmp/keel ./cmd/keel
      - name: Soak
        run: |
          rm -rf dist/soak  # a self-hosted workspace keeps the last run's
          python3 scripts/soak.py --bin /tmp/keel --out dist/soak \
            --seconds "${{ github.event.inputs.seconds || '16200' }}" \
            --cycle-seconds "${{ github.event.inputs.cycle_seconds || '30' }}" \
            ${{ matrix.args }}
      - name: Bound persistence evidence before upload
        if: always()
        run: |
          mkdir -p dist/soak
          timeout 120s python3 scripts/archive-failed-aof.py dist/soak > dist/soak/preservation.log 2>&1
      - name: Retain evidence, including a failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soak-${{ strategy.job-index }}
          path: |
            dist/soak/**/*.json
            dist/soak/**/*.jsonl
            dist/soak/**/*.log
            dist/soak/**/*.gz
          retention-days: 30

  # Forty-eight hours of one primary process, which segments cannot give and a
  # hosted runner cannot hold. Only the continuous-primary shape needs it: the
  # recovery shapes restart their primary every third cycle by design.
  # Dispatched with uptime=true onto the `runner` input, normally the
  # self-hosted label `soak`. Always the full 48 hours.
  uptime:
    name: 48 hours of uptime, protocol 2 concurrent, continuous primary
    if: github.event.inputs.uptime == 'true'
    runs-on: ${{ github.event.inputs.runner }}
    timeout-minutes: 2940
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -trimpath -o /tmp/keel ./cmd/keel
      - name: Soak
        run: |
          rm -rf dist/soak
          python3 scripts/soak.py --bin /tmp/keel --out dist/soak \
            --seconds 172800 --cycle-seconds 300 \
            --replication-protocol 2 --concurrent --primary-crash-every 0
      - name: Bound persistence evidence before upload
        if: always()
        run: |
          mkdir -p dist/soak
          timeout 120s python3 scripts/archive-failed-aof.py dist/soak > dist/soak/preservation.log 2>&1
      - name: Retain evidence, including a failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soak-uptime-48h
          path: |
            dist/soak/**/*.json
            dist/soak/**/*.jsonl
            dist/soak/**/*.log
          retention-days: 90
