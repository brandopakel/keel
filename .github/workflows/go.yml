# Throwaway: a seed hunt for order dependence in cmd/keel (step 2.6, part 4).
# Not for merging; the branch is deleted once its results are recorded.
name: Go

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunt:
    name: cmd/keel hunt ${{ matrix.os }} ${{ matrix.mode }} ${{ matrix.leg }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mode: [plain, race]
        leg: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Shuffled runs
        env:
          MODE: ${{ matrix.mode }}
        run: |
          runs=6; build=""; [ "$MODE" = race ] && runs=2 && build="-race"
          go test $build -c -o "$RUNNER_TEMP/keel.test" ./cmd/keel
          cd cmd/keel
          failed=0
          for i in $(seq "$runs"); do
            start=$(python3 -c 'import time;print(time.time())')
            rc=0; out=$("$RUNNER_TEMP/keel.test" -test.shuffle=on -test.count=1 -test.timeout=15m 2>&1) || rc=$?
            took=$(python3 -c "import time;print(round(time.time()-$start,1))")
            seed=$(echo "$out" | grep -m1 -o -- '-test.shuffle [0-9]*' | awk '{print $2}')
            if [ $rc -ne 0 ]; then
              failed=$((failed+1))
              echo "::error::run $i failed with seed $seed after ${took}s"
              echo "$out" | grep -E -- '^--- FAIL|^    --- FAIL|Error Trace|Error:|Messages|expected|actual|panic|_test.go:[0-9]+:' | head -60
            else
              echo "run $i passed with seed $seed in ${took}s"
            fi
          done
          [ $failed -eq 0 ]
