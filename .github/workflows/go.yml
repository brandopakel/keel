# Throwaway: a seed hunt for order dependence in internal/core (step 2.6).
# Not for merging; the branch is deleted once its results are recorded.
name: Go

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunt:
    name: shuffle hunt ${{ matrix.leg }} (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {leg: 1, mode: plain, runs: 10}
          - {leg: 2, mode: plain, runs: 10}
          - {leg: 3, mode: plain, runs: 10}
          - {leg: 4, mode: plain, runs: 10}
          - {leg: 5, mode: plain, runs: 10}
          - {leg: 6, mode: plain, runs: 10}
          - {leg: 7, mode: plain, runs: 10}
          - {leg: 8, mode: plain, runs: 10}
          - {leg: 9, mode: race, runs: 3}
          - {leg: 10, mode: race, runs: 3}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Shuffled runs
        env:
          MODE: ${{ matrix.mode }}
          RUNS: ${{ matrix.runs }}
        run: |
          count=1; build=""; [ "$MODE" = race ] && count=3 && build="-race"
          go test $build -c -o "$RUNNER_TEMP/core.test" ./internal/core
          cd internal/core
          failed=0
          for i in $(seq "$RUNS"); do
            rc=0; out=$("$RUNNER_TEMP/core.test" -test.shuffle=on -test.count=$count -test.timeout=10m 2>&1) || rc=$?
            seed=$(echo "$out" | grep -m1 -o -- '-test.shuffle [0-9]*' | awk '{print $2}')
            if [ $rc -ne 0 ]; then
              failed=$((failed+1))
              echo "::error::run $i failed with seed $seed"
              echo "$out" | grep -E -- '^--- FAIL|Error Trace|Error:|Messages|expected|actual|panic' | head -40
            else
              echo "run $i passed with seed $seed"
            fi
          done
          [ $failed -eq 0 ]
