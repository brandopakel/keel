# Throwaway: which listener a cmd/keel readiness probe reaches (step 2.6).
# Not for merging; the branch is deleted once its results are recorded.
name: Go

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: port diag ${{ matrix.mode }} ${{ matrix.leg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [shuffled, whole]
        leg: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run and report
        env:
          MODE: ${{ matrix.mode }}
        run: |
          rc=0
          if [ "$MODE" = shuffled ]; then
            go test -race -count=3 -shuffle=on -v ./internal/core ./cmd/keel > "$RUNNER_TEMP/out.txt" 2>&1 || rc=$?
          else
            go test -v -count=1 ./... > "$RUNNER_TEMP/out.txt" 2>&1 || rc=$?
          fi
          echo "exit $rc"
          grep -E "PORTDIAG" "$RUNNER_TEMP/out.txt" | head -50
          echo "PORTDIAG lines: $(grep -c PORTDIAG "$RUNNER_TEMP/out.txt")"
          grep -E -- "^--- FAIL|^    --- FAIL|^FAIL|connection refused|connection reset|-test.shuffle" "$RUNNER_TEMP/out.txt" | head -30
          exit $rc
