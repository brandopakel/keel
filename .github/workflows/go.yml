# Build, vet and test on every push to the working branch and every pull
# request into it.
#
# This previously ran only on `main`, which tracks upstream unchanged — so none
# of the work on `develop` was ever built or tested here.
name: Go

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...
