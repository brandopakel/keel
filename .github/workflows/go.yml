# Throwaway: paired wall time of each package's tests, base against candidate
# (step 2.6). Not for merging; the branch is deleted once its results are recorded.
name: Go

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE: 988218d
  CAND: 466b90e

jobs:
  timing:
    name: timing ${{ matrix.os }} ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mode: [plain, race]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build both sides
        env:
          MODE: ${{ matrix.mode }}
        run: |
          flags=""; [ "$MODE" = race ] && flags="-race"
          for side in base cand; do
            rev=$BASE; [ $side = cand ] && rev=$CAND
            git worktree add --detach "$RUNNER_TEMP/$side" "$rev"
            for pkg in internal/core internal/server cmd/keel; do
              go -C "$RUNNER_TEMP/$side" test $flags -c -o "$RUNNER_TEMP/$side-${pkg//\//-}.test" ./$pkg
            done
          done
          git -C "$RUNNER_TEMP/base" log --oneline -1; git -C "$RUNNER_TEMP/cand" log --oneline -1
      - name: Time each package alone, alternating sides
        env:
          MODE: ${{ matrix.mode }}
        run: |
          rounds=3; [ "$MODE" = race ] && rounds=2
          echo "| round | order | package | base s | candidate s |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for round in $(seq $rounds); do
            order="base cand"; [ $((round % 2)) = 0 ] && order="cand base"
            for pkg in internal/core internal/server cmd/keel; do
              tb=0; tc=0
              for side in $order; do
                start=$(python3 -c 'import time;print(time.time())')
                rc=0
                (cd "$RUNNER_TEMP/$side/$pkg" && "$RUNNER_TEMP/$side-${pkg//\//-}.test" -test.count=1 -test.timeout=20m > "$RUNNER_TEMP/$side-$round-${pkg//\//-}.log" 2>&1) || rc=$?
                end=$(python3 -c 'import time;print(time.time())')
                took=$(python3 -c "print(round($end-$start,1))")
                if [ $side = base ]; then tb=$took; else tc=$took; fi
                [ $rc = 0 ] || { echo "::error::$side $pkg failed in round $round"; tail -30 "$RUNNER_TEMP/$side-$round-${pkg//\//-}.log"; }
              done
              echo "round $round ($order) $pkg base=${tb}s cand=${tc}s"
              echo "| $round | $order | $pkg | $tb | $tc |" >> "$GITHUB_STEP_SUMMARY"
            done
          done
