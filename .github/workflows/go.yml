# Build, vet and test on every push to the working branch and every pull
# request into it.
#
# This previously ran only on `main`, which tracks upstream unchanged — so none
# of the work on `develop` was ever built or tested here.
name: Go

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      # TEMPORARY diagnostic: is the CI failure Linux, or the race detector?
      # Both arms run so one push answers it. Removed once answered.
      - name: Measurement tests WITHOUT race
        continue-on-error: true
        run: go test -v -run 'TestEstimateTracksRealHeap|TestRewriteStallProfile' ./internal/core/... ./internal/data_structure/...

      - name: Measurement tests WITH race
        continue-on-error: true
        run: go test -v -race -run 'TestEstimateTracksRealHeap|TestRewriteStallProfile' ./internal/core/... ./internal/data_structure/...

      - name: Test
        run: go test -race -v ./...
