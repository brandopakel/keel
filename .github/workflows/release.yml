# Build release binaries when a version tag is pushed.
#
# Four platforms, because those are the four that build: the event loop is
# epoll on Linux and kqueue on darwin, selected by build tag, and there is no
# Windows implementation. Producing a Windows binary would mean writing one.
name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          version="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = tag ] || version="$(git rev-parse --short HEAD)"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/brandopakel/keel/internal/config.Version=${version}" \
            -o "dist/keel" ./cmd/keel
          # The notices for the code translated from Redis travel with the
          # binary, as their licence asks.
          cp THIRD_PARTY_NOTICES.md dist/
          tar -C dist -czf "keel_${version}_${GOOS}_${GOARCH}.tar.gz" keel THIRD_PARTY_NOTICES.md
          sha256sum "keel_${version}_${GOOS}_${GOARCH}.tar.gz" \
            > "keel_${version}_${GOOS}_${GOARCH}.tar.gz.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  release:
    name: attach to the release
    needs: binaries
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          path: dist

      # Pushing a tag does not create a release, and `gh release upload` will
      # not create one either - it fails on a tag that has no release, which
      # would have been the first time this workflow ever ran.
      - name: Create the release if the tag has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --repo "${GITHUB_REPOSITORY}" \
                 --title "${GITHUB_REF_NAME}" \
                 --generate-notes

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
