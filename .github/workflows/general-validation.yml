name: General cache validation

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      matched:
        description: Run the matched traversal adoption matrix on this runner
        type: boolean
        default: false
      baseline:
        description: Exact baseline commit
        type: string
        default: 40fb7e505176054b18098d70e5f7d8e79264a4a9
      cases:
        description: Optional comma-separated standard workload names
        type: string
        default: ''
      repetitions:
        description: Repetitions per arm
        type: number
        default: 3
      seconds:
        description: Seconds per measurement
        type: number
        default: 5
      memory:
        description: Include the nine-case memory matrix
        type: boolean
        default: true
      everysec:
        description: Also run the standard suite with the log on (appendfsync everysec), on a runner of its own
        type: boolean
        default: true
      profiles:
        description: Run separate candidate CPU/heap diagnostics after comparison
        type: boolean
        default: false
      profile_pair:
        description: Optional JSON with exact candidate/baseline SHAs for separate AOF CPU and allocation profiles
        type: string
        default: ''
      append_diagnostics:
        description: Optional exact runtime SHA for matched append-policy comparisons and separate profiles
        type: string
        default: ''
      capacity:
        description: Optional JSON configuration for scheduled capacity and large recovery
        type: string
        default: ''
      rewrite_validation:
        description: Optional exact baseline SHA for matched rewrite interference
        type: string
        default: ''
      transcript_validation:
        description: Optional exact baseline SHA for matched AOF transcript policies and modes
        type: string
        default: ''
      transcript_shutdown_seconds:
        description: Same supported shutdown grace for both transcript benchmark arms
        type: string
        default: '30'
      transcript_policies:
        description: JSON array of transcript policies to compare
        type: string
        default: '["off","no","everysec","always"]'
      rewrite_rate:
        description: Scheduled requests per second for matched rewrite interference
        type: string
        default: '2000'

permissions:
  contents: read

jobs:
  profile_pair:
    if: github.event_name == 'workflow_dispatch' && inputs.profile_pair != ''
    uses: ./.github/workflows/transcript-profiles.yml
    with:
      candidate: ${{ fromJSON(inputs.profile_pair).candidate }}
      baseline: ${{ fromJSON(inputs.profile_pair).baseline }}

  transcript_interference:
    if: github.event_name == 'workflow_dispatch' && inputs.transcript_validation != ''
    uses: ./.github/workflows/transcript-validation.yml
    with:
      baseline: ${{ inputs.transcript_validation }}
      policies: ${{ inputs.transcript_policies }}
      shutdown_seconds: ${{ inputs.transcript_shutdown_seconds }}

  rewrite_interference:
    if: github.event_name == 'workflow_dispatch' && inputs.rewrite_validation != ''
    uses: ./.github/workflows/rewrite-validation.yml
    with:
      baseline: ${{ inputs.rewrite_validation }}
      rate: ${{ inputs.rewrite_rate }}

  append_costs:
    if: github.event_name == 'workflow_dispatch' && inputs.append_diagnostics != ''
    uses: ./.github/workflows/append-diagnostics.yml
    with:
      candidate: ${{ inputs.append_diagnostics }}

  extended:
    if: github.event_name == 'workflow_dispatch' && inputs.capacity != ''
    uses: ./.github/workflows/capacity-validation.yml
    with:
      candidate: ${{ fromJSON(inputs.capacity).candidate }}
      baseline: ${{ fromJSON(inputs.capacity).baseline || '9f155872c60b07c0793e3653bd30d1fe96b8cb59' }}
      cases: ${{ fromJSON(inputs.capacity).cases || 'read-64,balanced-1k,expiry-storm,large-1m,large-hash,large-list,mixed-tenants' }}
      rates: ${{ fromJSON(inputs.capacity).rates || '1000,10000,50000,100000,150000' }}
      seconds: ${{ fromJSON(inputs.capacity).seconds || 10 }}
      repetitions: ${{ fromJSON(inputs.capacity).repetitions || 2 }}
      policy: ${{ fromJSON(inputs.capacity).policy || 'off' }}
      append_mode: ${{ fromJSON(inputs.capacity).append_mode || 'concurrent' }}

  broad:
    name: Redis differential and native workload smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: stable
      - name: Build native load generator
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libevent-dev libssl-dev zlib1g-dev redis-server lsof
          curl -fL --retry 3 https://github.com/redis/memtier_benchmark/archive/refs/tags/2.5.1.tar.gz -o /tmp/memtier.tar.gz
          echo '9b34e17a0d1d7e70b152eb442c6362161b5b764ce2ea98e97b7c74815bdd90b7  /tmp/memtier.tar.gz' | sha256sum -c -
          tar -xzf /tmp/memtier.tar.gz -C /tmp
          python3 scripts/prepare-memtier.py /tmp/memtier_benchmark-2.5.1
          cd /tmp/memtier_benchmark-2.5.1
          autoreconf -fi
          ./configure
          make -j2
      - name: Build Keel
        run: go build -trimpath -o /tmp/keel-general ./cmd/keel
      - name: HLL legacy persistence, rollback and replication
        run: |
          git fetch --depth 1 origin 87cea7140ade84b64e7a9afb20ec9f26bea71d3e
          mkdir /tmp/keel-hll-baseline
          git archive FETCH_HEAD | tar -x -C /tmp/keel-hll-baseline
          (cd /tmp/keel-hll-baseline && go build -trimpath -o /tmp/keel-hll-baseline-bin ./cmd/keel)
          python3 scripts/check-hll-upgrade.py --baseline /tmp/keel-hll-baseline-bin --candidate /tmp/keel-general --out dist/general-ci/hll-upgrade
      - name: Build Redis 8.10.1 and RedisBloom for the differentials
        # Replies, errors included, are compared byte for byte with Redis
        # 8.10.1's, and Ubuntu's redis-server is 7.0, whose error wording is
        # older. The tarball bundles its modules and builds all of them by
        # default; RedisBloom is the one BF, CF and CMS need, and RediSearch
        # does not build against this runner's Rust and clang.
        run: |
          curl -fL --retry 3 https://download.redis.io/releases/redis-8.10.1.tar.gz -o /tmp/redis-8.10.1.tar.gz
          echo '60166c95ab7aedaa9dfe516de685be0a4dd87be95ded59ba429df14c13f1b663  /tmp/redis-8.10.1.tar.gz' | sha256sum -c -
          tar -xzf /tmp/redis-8.10.1.tar.gz -C /tmp
          make -C /tmp/redis-8.10.1 -j"$(nproc)" build redisbloom
          /tmp/redis-8.10.1/src/redis-server --version
          ls -l /tmp/redis-8.10.1/modules/redisbloom/redisbloom.so
      - name: Error replies byte for byte against Redis 8.10.1 and RedisBloom
        run: |
          python3 scripts/error-parity.py --bin /tmp/keel-general --redis /tmp/redis-8.10.1/src/redis-server \
            --redis-module /tmp/redis-8.10.1/modules/redisbloom/redisbloom.so --out dist/general-ci/error-parity
      - name: Differential replies, rewrite and two restarts
        run: |
          python3 scripts/differential.py --bin /tmp/keel-general --redis /tmp/redis-8.10.1/src/redis-server --out dist/general-ci/differential --steps 20000
      - name: RESP3 differential replies, rewrite and two restarts
        run: |
          python3 scripts/differential.py --protocol 3 --bin /tmp/keel-general --redis /tmp/redis-8.10.1/src/redis-server \
            --redis-module /tmp/redis-8.10.1/modules/redisbloom/redisbloom.so --out dist/general-ci/differential-resp3 --steps 20000
      - name: RedisBloom reply parity, RESP2 and RESP3, byte for byte
        # Every BF and CF reply and error, edge cases and transactions
        # included, against the RedisBloom that Redis 8.10.1 ships, then the
        # filters through two crash restarts and a rewrite.
        run: |
          python3 scripts/redisbloom-parity.py --bin /tmp/keel-general --redis /tmp/redis-8.10.1/src/redis-server \
            --redis-module /tmp/redis-8.10.1/modules/redisbloom/redisbloom.so --out dist/general-ci/redisbloom-parity --steps 20000
      - name: All workload smoke cases
        run: |
          python3 bench/run-general.py --candidate /tmp/keel-general --memtier /tmp/memtier_benchmark-2.5.1/memtier_benchmark --out dist/general-ci/workloads --reps 1 --seconds 1
      - name: Eviction, replication recovery and slow readers
        run: python3 scripts/operational-matrix.py --bin /tmp/keel-general --out dist/general-ci/operations
      - name: Mixed-data soak and storage error recovery
        run: python3 scripts/soak.py --bin /tmp/keel-general --out dist/general-ci/soak --seconds 120 --cycle-seconds 15
      - name: Preserve raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: general-cache-validation
          path: dist/general-ci
          retention-days: 14

  # The standard suite runs both servers with the log off (run-general.py's
  # --policy off), so it never exercises the log's flush. The everysec leg
  # runs the same suite with the log on, on a runner of its own, so that
  # persistence work is measured end to end without anyone remembering to ask
  # (docs/embedding-plan.md, phase 3's write-up). The memory matrix and the
  # profiles stay with the log-off leg.
  matched:
    name: ${{ matrix.policy == 'off' && 'Matched keyspace adoption matrix' || format('Matched keyspace adoption matrix, appendfsync {0}', matrix.policy) }}
    if: github.event_name == 'workflow_dispatch' && inputs.matched
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        policy: ${{ fromJSON(inputs.everysec && '["off","everysec"]' || '["off"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: '1.27.1' }
      - name: Build pinned generator
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libevent-dev libssl-dev zlib1g-dev redis-server lsof strace
          curl -fL --retry 3 https://github.com/redis/memtier_benchmark/archive/refs/tags/2.5.1.tar.gz -o /tmp/memtier.tar.gz
          echo '9b34e17a0d1d7e70b152eb442c6362161b5b764ce2ea98e97b7c74815bdd90b7  /tmp/memtier.tar.gz' | sha256sum -c -
          tar -xzf /tmp/memtier.tar.gz -C /tmp
          cd /tmp/memtier_benchmark-2.5.1
          autoreconf -fi
          ./configure
          make -j2
          cp memtier_benchmark /tmp/memtier-unpatched
          python3 "$GITHUB_WORKSPACE/scripts/prepare-memtier.py" /tmp/memtier_benchmark-2.5.1
          make -j2
      - name: Build exact source pair and record host
        env:
          BASELINE_REVISION: ${{ inputs.baseline }}
          CGO_ENABLED: '0'
        run: |
          [[ "$BASELINE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git worktree add --detach "$RUNNER_TEMP/keel-baseline" "$BASELINE_REVISION"
          go -C "$RUNNER_TEMP/keel-baseline" build -trimpath -o /tmp/keel-baseline ./cmd/keel
          go build -trimpath -o /tmp/keel-candidate ./cmd/keel
          mkdir -p dist/matched
          lscpu > dist/matched/lscpu.txt
          df -T . > dist/matched/filesystem.txt
          uname -a > dist/matched/uname.txt
          go version > dist/matched/go.txt
          git rev-parse HEAD > dist/matched/candidate-source.txt
          git -C "$RUNNER_TEMP/keel-baseline" rev-parse HEAD > dist/matched/baseline-source.txt
          cp /proc/stat dist/matched/proc-stat-before.txt
          ps -eo pid,comm,pcpu,pmem > dist/matched/processes-before.txt
      - name: Verify prepared generator socket options outside measurements
        run: python3 scripts/check-memtier-sockets.py --bin /tmp/keel-candidate --memtier /tmp/memtier_benchmark-2.5.1/memtier_benchmark --unpatched /tmp/memtier-unpatched --out dist/matched/generator-sockets
      - name: Sequential paired workloads and memory with disjoint CPU masks
        env:
          SELECTED_CASES: ${{ inputs.cases }}
          REPETITIONS: ${{ inputs.repetitions }}
          MEASURE_SECONDS: ${{ inputs.seconds }}
          INCLUDE_MEMORY: ${{ inputs.memory }}
          DIAGNOSE_PROFILES: ${{ inputs.profiles }}
          LOG_POLICY: ${{ matrix.policy }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          cpus = sorted(os.sched_getaffinity(0))
          assert len(cpus) >= 2, 'two disjoint CPU masks required'
          # Keep all exposed SMT siblings on the same side of the measurement.
          topology = {}
          for cpu in cpus:
              base = Path(f'/sys/devices/system/cpu/cpu{cpu}/topology')
              topology[cpu] = tuple((base/name).read_text().strip() for name in ('physical_package_id','core_id'))
          server_set = [cpu for cpu in cpus if topology[cpu] == topology[cpus[0]]]
          client_set = [cpu for cpu in cpus if cpu not in server_set]
          assert client_set, 'two exposed physical cores required'
          server, clients = ','.join(map(str,server_set)), ','.join(map(str,client_set))
          Path('dist/matched/affinity.json').write_text(json.dumps({'server':server,'generator':clients,'topology':topology,'limitation':'Disjoint exposed core groups on one hosted VM; host scheduling and underlying tenancy are uncontrolled.'},indent=2))
          common = ['python3','bench/run-general.py','--candidate','/tmp/keel-candidate','--memtier','/tmp/memtier_benchmark-2.5.1/memtier_benchmark','--server-cpus',server,'--client-cpus',clients,'--load-threads','2']
          policy = os.environ['LOG_POLICY']
          compare = common+['--baseline','/tmp/keel-baseline','--reps',os.environ['REPETITIONS'],'--seconds',os.environ['MEASURE_SECONDS'],'--policy',policy]
          suites = ['standard'] + (['memory'] if os.environ['INCLUDE_MEMORY'] == 'true' and policy == 'off' else [])
          for suite in suites:
              selected = ['--cases',os.environ['SELECTED_CASES']] if suite == 'standard' and os.environ['SELECTED_CASES'] else []
              subprocess.run(compare+selected+['--suite',suite,'--out','dist/matched/'+suite],check=True)
              subprocess.run(['python3','bench/summarize-general.py','dist/matched/'+suite],check=True)
          if os.environ['DIAGNOSE_PROFILES'] == 'true' and policy == 'off':
              selected = ['--cases',os.environ['SELECTED_CASES']] if os.environ['SELECTED_CASES'] else ['--cases','working-set-100k']
              subprocess.run(common+selected+['--profiles','--reps','1','--seconds','30','--out','dist/matched/profiles'],check=True)
          PY
      - name: Record final host state
        if: always()
        run: |
          mkdir -p dist/matched
          cp /proc/stat dist/matched/proc-stat-after.txt
          ps -eo pid,comm,pcpu,pmem > dist/matched/processes-after.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.policy == 'off' && 'matched-keyspace-adoption' || format('matched-keyspace-adoption-{0}', matrix.policy) }}
          path: dist/matched
          retention-days: 30
