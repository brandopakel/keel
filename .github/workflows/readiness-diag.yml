name: Readiness diagnostic (throwaway, not for merging)

on:
  push:
    branches: ['test/readiness-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: readiness diag / ${{ matrix.os }} / ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-latest, macos-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { persist-credentials: false }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: stable }
      - name: Backlog overflow and inherited probe
        shell: bash
        run: |
          set -uo pipefail
          uname -a
          mkdir -p dist
          KEEL_READINESS_DIAG=1 KEEL_DIAG_SECONDS=60 go test ./cmd/keel -run '^(TestDiagBacklogOverflow|TestDiagInheritedProbe)$' -count=1 -v -timeout=10m > dist/experiments.log 2>&1
          echo "exit $?"
          grep -h 'READINESSDIAG' dist/experiments.log | cut -c1-700 | head -80
      - name: In situ, whole suite three times (as Native recovery runs it)
        shell: bash
        run: |
          set -uo pipefail
          for i in 1 2 3; do
            go test -v -count=1 ./... > dist/suite-$i.log 2>&1
            echo "suite $i exit $?"
            grep -h 'READINESSDIAG\|^--- FAIL\|^FAIL\|connection refused\|connection reset' dist/suite-$i.log | cut -c1-700 | head -60
          done
      - name: In situ, cmd/keel under race
        shell: bash
        run: |
          set -uo pipefail
          go test -v -race -count=2 ./cmd/keel > dist/race.log 2>&1
          echo "race exit $?"
          grep -h 'READINESSDIAG\|^--- FAIL\|^FAIL\|connection refused\|connection reset' dist/race.log | cut -c1-700 | head -60
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: readiness-diag-${{ matrix.os }}-${{ matrix.shard }}
          path: dist/
          retention-days: 7
