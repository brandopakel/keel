name: Readiness diagnostic (throwaway, not for merging)

on:
  push:
    branches: ['test/readiness-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: readiness diag / ${{ matrix.os }} / ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { persist-credentials: false }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: stable }
      - name: Prepare
        run: mkdir -p dist
      - name: Shuffled hunt, cmd/keel, five passes
        shell: bash
        run: |
          set -uo pipefail
          go test -v -shuffle=on -count=5 ./cmd/keel > dist/shuffled.log 2>&1
          echo "shuffled exit $?"
          grep -h 'READINESSDIAG\|^--- FAIL\|^FAIL\|-test.shuffle\|connection refused\|connection reset\|did not answer' dist/shuffled.log | cut -c1-700 | head -60
      - name: Whole suite once (as Native recovery runs it)
        shell: bash
        run: |
          set -uo pipefail
          go test -v -count=1 ./... > dist/suite.log 2>&1
          echo "suite exit $?"
          grep -h 'READINESSDIAG\|^--- FAIL\|^FAIL\|connection refused\|connection reset\|did not answer' dist/suite.log | cut -c1-700 | head -60
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: readiness-diag-fixed-2-${{ matrix.os }}-${{ matrix.shard }}
          path: dist/
          retention-days: 7
