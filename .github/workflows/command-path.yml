# Paired command-path benchmarks: a change against its base.
#
# The embedding plan (docs/embedding-plan.md) moves every store, the evictor
# and the log into an engine, a step at a time, and each step adds an
# indirection to the path a command takes. This job runs BenchmarkCommandPath,
# BenchmarkCommandPathUnderEviction, BenchmarkCommandPathWithLog and
# BenchmarkCommandPathWithReplica on the base and the change, on the same
# runner, and scripts/compare-benchmarks.py compares them.
#
# How the runs are paired:
# - Both sides are built with -trimpath, from worktrees whose paths have the
#   same length, and each runs from its own package directory. The build
#   directory is not in either binary, so two builds of the same source are
#   byte-identical, and the provenance says when they are. Without -trimpath,
#   two builds of one commit from two directories differ by 4 KiB from the
#   paths alone. The A/A run that showed it had a candidate slower in every
#   round, 9.8% in the median (run 37091722334).
# - Each round runs the two binaries back to back, and the order alternates:
#   odd rounds run the baseline first, even rounds the candidate (ABBA). Each
#   candidate run is paired with the baseline run next to it, so drift between
#   rounds cancels out of each ratio, and a cost of running second falls on
#   both sides equally. The comparison fails if the orders do not balance.
# - Every run executes a fresh copy of its side's binary (see the rounds step).
# - BenchmarkCommandPathWithLog, the command path with the log open, came with
#   step 2.3 of the plan, and BenchmarkCommandPathWithReplica, the same with a
#   protocol 2 replication feed on, with step 2.4. Their files use only what
#   the package had before, so a baseline older than one (develop before the
#   step, or 65ebdbc for a cumulative run) builds the candidate's copy of that
#   file. Both sides then run the same benchmark code against their own build,
#   and the provenance says so. Every other file is each side's own.
# - Since step 2.5 those two files set nothing themselves, and since step 2.7
#   they name no engine API either: each family runs on the engine
#   command_path_settings_test.go hands it, a benchEngine, held to engine
#   options. A baseline that borrows them predates engines, so it also gets
#   internal/core/testdata/command-path/command_path_settings_test.go in that
#   file's place, whose benchEngine is the baseline's one keyspace: it sets the
#   same through config, empties the stores, and calls the baseline's package
#   functions. Every method of either is inlined, so both timed loops call the
#   dispatch directly. Every benchmark holds its engine to the server's former
#   5,000,000-key cap, which a baseline from before step 2.5 held it to by
#   default, so that both sides count keys on every write. (The server itself
#   has had no key bound by default since October 5, 2026; the benchmarks keep
#   the cap so they compare the same work.)
#
# What fails the job: more allocations per operation on any row, eviction
# rows whose evictions/op is not sane on both sides, and any row that does not
# parse, is missing from one side or one round, or reports different metrics
# on the two sides. Time is reported with an interval and is not gated.
#
# Noise floor, measured on ubuntu-latest with 12 rounds on 2026-10-03.
# "Median" is the median paired ratio across the 20 benchmarks, with its 95%
# interval. "Benchmarks" is the range of the single benchmarks' medians.
#
#   Run          Host           Median  Interval        Benchmarks
#   A/A, develop against develop, byte-identical binaries:
#   37155424821  Xeon 6973P-C   1.003   0.999 to 1.028  0.970 to 1.022
#   37155427790  EPYC 9V74      1.002   1.000 to 1.005  0.983 to 1.014
#   37155430926  EPYC 7763      0.999   0.996 to 1.001  0.988 to 1.005
#   37155434251  EPYC 7763      1.000   0.997 to 1.002  0.990 to 1.012
#   Layout control: develop against develop plus an unreachable branch in a
#   cold function, so the code moves and nothing new runs (the last two runs
#   came before the fresh copy per run):
#   37155437598  EPYC 9V45      0.996   0.984 to 1.008  0.961 to 1.034
#   37155440411  EPYC 9V74      0.987   0.979 to 0.994  0.905 to 1.034
#   37154644606  EPYC 7763      0.965   0.961 to 0.976  0.919 to 1.034
#   37154648439  Xeon 8573C     1.003   0.999 to 1.007  0.976 to 1.019
#   A/A before this pairing (6 rounds, baseline always first, no -trimpath):
#   37091722334  EPYC 9V74      1.098   1.077 to 1.102  1.003 to 1.165
#   37153909284  EPYC 7763      1.001   0.993 to 1.003  0.986 to 1.019
#   37153912995  EPYC 7763      1.003   0.996 to 1.007  0.992 to 1.028
#   37153916307  EPYC 9V74      1.000   0.995 to 1.009  0.992 to 1.020
#
# Why time is not gated: an A/A run now lands within 0.3% of 1 in the median
# and within 3% in any single benchmark. A real change also moves code,
# though. Layout alone moved the median by up to 3.5% and a single benchmark
# by up to 9.5%, in either direction, and outside the intervals: they measure
# noise within a run, while a build's layout is fixed for the whole run. A 2%
# gate would fail changes that cost nothing and pass ones that cost more
# whenever the layout favours them. So read the median across benchmarks
# against the plan's 0.98 rule. A result near the budget, or a single
# benchmark over it, needs repeated runs (they land on different hosts) or
# bench/run-ab.sh before it counts against a step.
name: Command path

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Revision to compare against (default develop)
        default: develop
      candidate:
        description: Revision to measure (default the revision this runs on)
        default: ''
      rounds:
        description: Rounds, an even number from 4 to 40; each runs both sides once
        default: '12'
  pull_request:
    branches: [develop]
    paths: ['internal/**', 'cmd/**', 'go.mod', 'go.sum', '.github/workflows/command-path.yml',
            'scripts/compare-benchmarks.py', 'scripts/test_compare_benchmarks.py']

permissions:
  contents: read

jobs:
  paired:
    name: Paired command-path benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # An explicit bash runs with -o pipefail, so the comparison's exit
        # status survives its pipe into the step summary.
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version-file: go.mod }
      - name: Comparison tests
        run: python3 -m unittest discover -s scripts -p 'test_compare_benchmarks.py' -v
      - name: Build both sides
        env:
          BASELINE: ${{ github.event.pull_request.base.sha || inputs.baseline }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          mkdir -p dist/command-path
          # A branch name from the dispatch input exists only as origin/<name>.
          resolve() { git rev-parse --verify --quiet "$1^{commit}" || git rev-parse --verify "origin/$1^{commit}"; }
          base=$(resolve "$BASELINE")
          cand=$(resolve "${CANDIDATE:-HEAD}")
          # Each side builds and runs its own benchmark file, so a change to
          # the setup code is measured where it lands.
          for side in base cand; do
            rev=$base; [ "$side" = cand ] && rev=$cand
            git worktree add --detach "$RUNNER_TEMP/$side" "$rev"
          done
          # A baseline from before the log-on or the replica-on benchmark
          # builds the candidate's copy of its file (see the header), or its
          # rows would be missing from one side.
          borrowed=''
          for file in internal/core/command_path_log_bench_test.go internal/core/command_path_replica_bench_test.go; do
            if [ -f "$RUNNER_TEMP/cand/$file" ] && [ ! -f "$RUNNER_TEMP/base/$file" ]; then
              cp "$RUNNER_TEMP/cand/$file" "$RUNNER_TEMP/base/$file"
              borrowed="$borrowed $file"
            fi
          done
          # The borrowed files take their engine and settings from
          # command_path_settings_test.go. A baseline without it predates
          # engines and their options, so it gets the copy that runs on its
          # one keyspace and sets the same through config (see the header).
          settings=internal/core/command_path_settings_test.go
          legacy=internal/core/testdata/command-path/command_path_settings_test.go
          if [ -n "$borrowed" ] && [ -f "$RUNNER_TEMP/cand/$legacy" ] && [ ! -f "$RUNNER_TEMP/base/$settings" ]; then
            cp "$RUNNER_TEMP/cand/$legacy" "$RUNNER_TEMP/base/$settings"
            borrowed="$borrowed $legacy (as $settings)"
          fi
          for side in base cand; do
            go -C "$RUNNER_TEMP/$side" test -c -trimpath -o "$RUNNER_TEMP/$side.test" ./internal/core
          done
          { echo "baseline $base"
            echo "candidate $cand"
            if [ -n "$borrowed" ]; then echo "baseline builds the candidate's$borrowed"; fi
            echo "runner $(uname -srm) cpus $(nproc) $(grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //')"
            go version
            (cd "$RUNNER_TEMP" && sha256sum base.test cand.test)
            if cmp -s "$RUNNER_TEMP/base.test" "$RUNNER_TEMP/cand.test"; then
              echo 'binaries identical: an A/A run'
            fi; } | tee dist/command-path/provenance.txt
      - name: Alternating rounds
        id: rounds
        env:
          ROUNDS: ${{ inputs.rounds || '12' }}
        run: |
          if ! [[ $ROUNDS =~ ^[0-9]+$ ]] || (( ROUNDS < 4 || ROUNDS > 40 || ROUNDS % 2 )); then
            echo "rounds must be an even number from 4 to 40, not '$ROUNDS'" >&2
            exit 1
          fi
          # One run of one side, from its own package directory, with the
          # round and the side that went first written before its output.
          # Each run executes a fresh copy of its side's binary, so the
          # physical pages its code is read into change from run to run. With
          # one file per side for the whole job, an A/A pair of identical
          # binaries ran the candidate slower in 10 of 12 rounds, 0.5% overall
          # (run 37154602660): something fixed per file, which no interval
          # within the run could show. A copy per run turns it into noise
          # between pairs, which the intervals include.
          measure() {
            local side=$1 file=$2 round=$3 first=$4
            cp "$RUNNER_TEMP/$side.test" "$RUNNER_TEMP/$side.run"
            { echo "keel-round: $round"
              echo "keel-first: $first"
              (cd "$RUNNER_TEMP/$side/internal/core" && "$RUNNER_TEMP/$side.run" -test.run '^$' \
                -test.bench '^BenchmarkCommandPath' -test.benchmem -test.benchtime=200ms)
            } >> "dist/command-path/$file.txt"
            rm "$RUNNER_TEMP/$side.run"
          }
          for round in $(seq "$ROUNDS"); do
            if (( round % 2 )); then
              measure base baseline "$round" baseline
              measure cand candidate "$round" baseline
            else
              measure cand candidate "$round" candidate
              measure base baseline "$round" candidate
            fi
          done
      - name: Compare
        # A run that stopped partway is still compared, so that its missing
        # rounds and failure output are listed in the summary.
        if: ${{ !cancelled() && (steps.rounds.outcome == 'success' || steps.rounds.outcome == 'failure') }}
        run: |
          python3 scripts/compare-benchmarks.py dist/command-path/baseline.txt dist/command-path/candidate.txt \
            --json dist/command-path/comparison.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: command-path-benchmarks
          path: dist/command-path
          retention-days: 30
