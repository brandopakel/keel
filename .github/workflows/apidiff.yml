# The public package's API, compared with the base's on every pull request
# that touches it, with apidiff (golang.org/x/exp/cmd/apidiff), pinned.
#
# Pre-1.0, a minor release may break the API, with migration notes
# (docs/public-api.md, "Stability"); a pull request that means to carries the
# label api-break, and is then reported rather than failed. Everything else
# that apidiff calls incompatible fails the job: a removed or changed
# function, method, field or type, or a type that stops being comparable.
name: API compatibility

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: ['*.go', 'go.mod', 'go.sum', 'scripts/api-compat.sh', '.github/workflows/apidiff.yml']

permissions:
  contents: read

jobs:
  apidiff:
    name: apidiff of package keel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: Install apidiff, pinned
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260908205506-85c1c2202aba
      - name: Compare with the base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          ALLOW_BREAK: ${{ contains(github.event.pull_request.labels.*.name, 'api-break') && '1' || '0' }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          status=0
          sh scripts/api-compat.sh "$RUNNER_TEMP/base" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/apidiff" || status=$?
          {
            echo '## apidiff of package keel'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/apidiff/report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
