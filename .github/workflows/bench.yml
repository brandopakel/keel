# Full benchmark suite on Linux, where the event loop runs on epoll.
#
# Covers what the local darwin runs could not: the epoll path, memory and
# latency on Linux rather than only darwin, several net.Conn designs rather than
# one, and a measurement that is not loopback.
name: Benchmark

on:
  workflow_dispatch:
  push:
    branches: [ develop, experiment/** ]

jobs:
  matrix:
    name: throughput matrix (loopback)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.21' }
      - run: sudo apt-get update && sudo apt-get install -y redis-server redis-tools
      - run: go build -o /tmp/memkv ./cmd
      - name: environment
        run: |
          { echo "runner: $(uname -srm)  cpus: $(nproc)  mem: $(free -h|awk '/Mem:/{print $2}')"
            echo "go: $(go version)"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: verify every mode serves
        run: |
          set -e
          port=7100
          for m in kqueue-nobuf kqueue net net-small net-direct net-chan; do
            port=$((port+1)); /tmp/memkv -port $port -mode $m & sleep 1
            [ "$(redis-cli -p $port ping)" = "PONG" ] || { echo "$m failed"; exit 1; }
            echo "  $m OK"; pkill -f "/tmp/memkv -port $port" || true; sleep 0.3
          done
      - run: BIN=/tmp/memkv OUT=bench/results/matrix-linux.csv REPS=5 ./bench/run-matrix.sh
      - run: python3 bench/summarise.py bench/results/matrix-linux.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: linux-matrix, path: bench/results/matrix-linux.csv }

  memory-and-latency:
    name: memory + latency (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.21' }
      - run: |
          sudo apt-get update
          sudo apt-get install -y redis-server redis-tools lsof
          sudo apt-get install -y memtier-benchmark || echo "memtier unavailable, latency step will skip"
      - run: go build -o /tmp/memkv ./cmd
      - name: memory vs connection count
        run: |
          ulimit -n 65535
          BIN=/tmp/memkv OUT=bench/results/memory-linux.csv ./bench/run-memory.sh
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import csv
          from collections import defaultdict
          d=defaultdict(dict)
          for r in csv.DictReader(open("bench/results/memory-linux.csv")):
              d[r["server"]][r["conns"]]=(int(r["rss_kb"]),float(r["goroutine_cost_kb_per_conn"]))
          S=[s for s in ["redis","kqueue-nobuf","kqueue","net","net-small","net-direct","net-chan"] if s in d]
          print("## Memory on Linux\n")
          print("| conns | " + " | ".join(S) + " |"); print("|---|"+"---:|"*len(S))
          for n in ["0","100","500","1000","5000"]:
              print(f"| {n} | " + " | ".join(f"{d[s][n][0]/1024:.1f} MB" if n in d.get(s,{}) else "-" for s in S) + " |")
          print("\n**KB per connection**\n")
          print("| conns | " + " | ".join(S) + " |"); print("|---|"+"---:|"*len(S))
          for n in ["1000","5000"]:
              print(f"| {n} | " + " | ".join(f"{d[s][n][1]:.2f}" if n in d.get(s,{}) else "-" for s in S) + " |")
          PY
      - name: latency percentiles
        run: |
          command -v memtier_benchmark >/dev/null || { echo "memtier not installed, skipping"; exit 0; }
          BIN=/tmp/memkv OUT=bench/results/memtier-linux.csv REPS=3 ./bench/run-memtier.sh || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-memory-latency
          path: bench/results/memory-linux.csv

  off-loopback:
    name: off-loopback (veth across namespaces)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.21' }
      - run: sudo apt-get update && sudo apt-get install -y redis-server redis-tools iproute2
      - run: go build -o /tmp/memkv ./cmd
      - name: run across a veth pair
        run: |
          BIN=/tmp/memkv OUT=bench/results/offloopback-linux.csv ./bench/run-offloopback.sh
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import csv,statistics as st
          from collections import defaultdict
          agg=defaultdict(list)
          for r in csv.DictReader(open("bench/results/offloopback-linux.csv")):
              v=float(r["rps"])
              if v>0: agg[(r["server"],r["command"],r["pipeline"],r["datasize"])].append(v)
          med={k:st.median(v) for k,v in agg.items()}
          servers=sorted({k[0] for k in med})
          scen=sorted({(k[1],k[2],k[3]) for k in med}, key=lambda x:(x[0],int(x[1]),int(x[3])))
          print("## Off-loopback (veth pair, MTU 1500)\n")
          print("| scenario | " + " | ".join(servers) + " |"); print("|---|"+"---:|"*len(servers))
          for c,p,d in scen:
              row=[f"{med[(s,c,p,d)]:,.0f}" if (s,c,p,d) in med else "-" for s in servers]
              print(f"| {c} P={p} d={d} | " + " | ".join(row) + " |")
          PY
      - uses: actions/upload-artifact@v4
        with: { name: linux-offloopback, path: bench/results/offloopback-linux.csv }
