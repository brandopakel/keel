# Full benchmark suite on Linux, where the event loop runs on epoll.
#
# Covers what the local darwin runs could not: the epoll path, memory and
# latency on Linux rather than only darwin, several net.Conn designs rather than
# one, and a measurement that is not loopback.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Tail smoke, full matrix, closeout, or offline hosted benchmark image
        type: choice
        options: [tail, full, closeout, hosted]
        default: tail
  push:
    branches: [ develop, experiment/** ]

permissions:
  contents: read

jobs:
  hosted:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'hosted'
    uses: ./.github/workflows/hosted.yml

  closeout:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'closeout'
    uses: ./.github/workflows/closeout.yml

  matrix:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
    name: throughput matrix (loopback)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version-file: go.mod }
      - run: sudo apt-get update && sudo apt-get install -y redis-server redis-tools lsof
      - run: go build -o /tmp/keel ./cmd/keel
      - name: environment
        run: |
          { echo "runner: $(uname -srm)  cpus: $(nproc)  mem: $(free -h|awk '/Mem:/{print $2}')"
            echo "go: $(go version)"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: verify every mode serves
        run: |
          set -e
          port=7100
          for m in kqueue-nobuf kqueue net net-small net-direct net-chan; do
            port=$((port+1)); /tmp/keel -port $port -mode $m & server_pid=$!; sleep 1
            [ "$(redis-cli -p $port ping)" = "PONG" ] || { echo "$m failed"; exit 1; }
            echo "  $m OK"; kill "$server_pid"; wait "$server_pid" || true; sleep 0.3
          done
      - run: BIN=/tmp/keel OUT=bench/results/matrix-linux.csv REPS=5 ./bench/run-matrix.sh
      - run: python3 bench/summarise.py bench/results/matrix-linux.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: linux-matrix, path: bench/results/matrix-linux.csv }

  memory-and-latency:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
    name: memory + latency (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version-file: go.mod }
      - run: |
          sudo apt-get update
          sudo apt-get install -y redis-server redis-tools lsof
          sudo apt-get install -y memtier-benchmark
      - run: go build -o /tmp/keel ./cmd/keel
      - name: memory vs connection count
        run: |
          ulimit -n 65535
          BIN=/tmp/keel OUT=bench/results/memory-linux.csv ./bench/run-memory.sh
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import csv
          from collections import defaultdict
          from statistics import median
          samples=defaultdict(list)
          d=defaultdict(dict)
          for r in csv.DictReader(open("bench/results/memory-linux.csv")):
              samples[(r["server"],r["conns"])].append((int(r["rss_kb"]),float(r["rss_delta_kb_per_conn"])))
          for (server, conns), rows in samples.items():
              d[server][conns]=(median(v[0] for v in rows),median(v[1] for v in rows))
          S=[s for s in ["redis","kqueue-nobuf","kqueue","net","net-small","net-direct","net-chan"] if s in d]
          print("## Memory on Linux\n")
          print("| conns | " + " | ".join(S) + " |"); print("|---|"+"---:|"*len(S))
          for n in ["0","100","500","1000","5000"]:
              print(f"| {n} | " + " | ".join(f"{d[s][n][0]/1024:.1f} MB" if n in d.get(s,{}) else "-" for s in S) + " |")
          print("\n**KB per connection**\n")
          print("| conns | " + " | ".join(S) + " |"); print("|---|"+"---:|"*len(S))
          for n in ["1000","5000"]:
              print(f"| {n} | " + " | ".join(f"{d[s][n][1]:.2f}" if n in d.get(s,{}) else "-" for s in S) + " |")
          PY
      - name: latency percentiles
        run: |
          BIN=/tmp/keel OUT=bench/results/memtier-linux.csv REPS=3 ./bench/run-memtier.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-memory-latency
          path: bench/results/

  off-loopback:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
    name: off-loopback (veth across namespaces)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version-file: go.mod }
      - run: sudo apt-get update && sudo apt-get install -y redis-server redis-tools iproute2 lsof
      - run: go build -o /tmp/keel ./cmd/keel
      - name: run across a veth pair
        run: |
          BIN=/tmp/keel OUT=bench/results/offloopback-linux.csv ./bench/run-offloopback.sh
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import csv,statistics as st
          from collections import defaultdict
          agg=defaultdict(list)
          for r in csv.DictReader(open("bench/results/offloopback-linux.csv")):
              v=float(r["rps"])
              if v<=0: raise ValueError("nonpositive throughput measurement")
              agg[(r["server"],r["command"],r["pipeline"],r["datasize"])].append(v)
          med={k:st.median(v) for k,v in agg.items()}
          servers=sorted({k[0] for k in med})
          scen=sorted({(k[1],k[2],k[3]) for k in med}, key=lambda x:(x[0],int(x[1]),int(x[3])))
          print("## Off-loopback (veth pair, MTU 1500)\n")
          print("| scenario | " + " | ".join(servers) + " |"); print("|---|"+"---:|"*len(servers))
          for c,p,d in scen:
              row=[f"{med[(s,c,p,d)]:,.0f}" if (s,c,p,d) in med else "-" for s in servers]
              print(f"| {c} P={p} d={d} | " + " | ".join(row) + " |")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: linux-offloopback, path: bench/results/offloopback-linux.csv }

  tail-latency:
    if: github.event_name != 'workflow_dispatch' || (inputs.suite != 'closeout' && inputs.suite != 'hosted')
    name: mixed traffic and rewrite (${{ matrix.append }})
    strategy:
      fail-fast: false
      matrix:
        append: [sync, async]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version-file: go.mod }
      - run: go build -o /tmp/keel ./cmd/keel
      - name: Repeated workload with retained errors and dropped probes
        env:
          APPEND_MODE: ${{ matrix.append }}
        run: |
          args=()
          if [[ "$APPEND_MODE" == async ]]; then args+=(--async-append); fi
          python3 bench/run-tail.py --bin /tmp/keel --out "bench/results/tail-linux-$APPEND_MODE.csv.gz" --seconds 30 --reps 3 "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-tail-latency-${{ matrix.append }}
          path: bench/results/tail-linux-*
